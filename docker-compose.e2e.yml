services:
  pulsar:
    image: apachepulsar/pulsar:3.1.0
    container_name: pulsar-e2e
    command: bin/pulsar standalone
    ports:
      - "6650:6650"
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/admin/v2/clusters"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-e2e
    ports:
      - "8000:8000"
    depends_on:
      pulsar:
        condition: service_healthy
    environment:
      - PULSAR_URL=pulsar://pulsar:6650
      - PULSAR_ADMIN=http://pulsar:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 15