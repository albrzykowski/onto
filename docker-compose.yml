version: "3.8"

services:
  pulsar:
    image: apachepulsar/pulsar:3.1.0
    container_name: onto-pulsar
    command: bin/pulsar standalone
    ports:
      - "6650:6650"
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/admin/v2/clusters"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - onto-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: onto-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - onto-net

  postgres:
    image: postgres:15
    container_name: onto-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=onto
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d onto"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - onto-net

  consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: onto-consumer
    depends_on:
      pulsar:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - PULSAR_URL=pulsar://pulsar:6650
      - PULSAR_ADMIN=http://pulsar:8080
      - QDRANT_HOST=qdrant
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=onto
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - onto-net
    restart: unless-stopped
    command: ["python", "-m", "app.queue.consumer"]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: onto-api
    ports:
      - "8000:8000"
    depends_on:
      pulsar:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - PULSAR_URL=pulsar://pulsar:6650
      - PULSAR_ADMIN=http://pulsar:8080
      - QDRANT_HOST=qdrant
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=onto
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - onto-net
    restart: unless-stopped

networks:
  onto-net:
    driver: bridge