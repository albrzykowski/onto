version: "3.8"

services:
  pulsar:
    image: apachepulsar/pulsar:3.1.0
    container_name: onto-pulsar
    command: bin/pulsar standalone
    ports:
      - "6650:6650"
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/admin/v2/clusters"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - onto-net

  consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: onto-consumer
    depends_on:
      pulsar:
        condition: service_healthy
    environment:
      - PULSAR_URL=pulsar://pulsar:6650
      - PULSAR_ADMIN=http://pulsar:8080
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - onto-net
    restart: unless-stopped
    command: ["python", "-m", "app.queue.consumer"]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: onto-api
    ports:
      - "8000:8000"
    depends_on:
      pulsar:
        condition: service_healthy
    environment:
      - PULSAR_URL=pulsar://pulsar:6650
      - PULSAR_ADMIN=http://pulsar:8080
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - onto-net
    restart: unless-stopped

networks:
  onto-net:
    driver: bridge