[dependency-groups]
dev = [
  "linkml>=1.8",
  "linkml-runtime>=1.8",
  "mypy>=1.11",
  "ruff>=0.6",
  "mistralai>=1.12,<2",
  "openai>=1",
  "pytest>=8",
  "pytest-bdd>=8",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RET", "C4", "ARG", "PTH"]
ignore = ["PTH123"]
