[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["e2e: end-to-end tests requiring running services"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "PL"]
ignore = [
    "E501",  # line too long
    "E701",  # multiple statements
    "E702",  # semicolons
    "E722",  # bare except
    "E401",  # multiple imports
    "I001",  # import sorting
    "W292",  # no newline
    "PLR2004",  # magic value comparisons
]

[tool.mypy]
python-version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false