[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["e2e: end-to-end tests requiring running services"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "PL"]
ignore = [
    "E501",  # line too long
    "E702",  # semicolons
    "E722",  # bare except
    "W292",  # no newline
]

[tool.ruff.lint.pylint]
max-branches = 5
max-locals = 5
max-returns = 2
max-statements = 10
max-nested-blocks = 2
max-bool-expr = 2
max-public-methods = 5

[tool.mypy]
python-version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
