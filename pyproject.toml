[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["e2e: end-to-end tests requiring running services"]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "PL"]
ignore = [
    "E501",  # line too long (we prefer readability over strict line-length enforcement)
    "W292",  # missing newline at end of file (often handled automatically by formatters like Ruff or Black)
    "E701",  # allow multiple statements on one line using semicolons
    "E702",  # allow multiple statements on one line (semicolon)

]

[tool.ruff.lint.pylint]
max-branches = 5
max-locals = 5
max-returns = 4
max-statements = 10
max-nested-blocks = 2
max-bool-expr = 2
max-public-methods = 5

[tool.mypy]
python-version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
