services:
  pulsar:
    image: apachepulsar/pulsar:3.1.0
    container_name: pulsar-e2e
    command: bin/pulsar standalone
    ports:
      - "6650:6650"
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/admin/v2/clusters"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - onto-e2e

  consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: consumer-e2e
    depends_on:
      pulsar:
        condition: service_healthy
    environment:
      - PULSAR_URL=pulsar://host.docker.internal:6650
      - PULSAR_ADMIN=http://host.docker.internal:8080
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - onto-e2e
    restart: on-failure
    command: ["python", "-m", "app.queue.consumer"]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: api-e2e
    ports:
      - "8000:8000"
    depends_on:
      pulsar:
        condition: service_healthy
    environment:
      - PULSAR_URL=pulsar://host.docker.internal:6650
      - PULSAR_ADMIN=http://host.docker.internal:8080
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - onto-e2e
    restart: on-failure

networks:
  onto-e2e:
    driver: bridge